<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dynamic Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .con {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .box {
            height: 200px;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
        }

        img {
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>DYNAMIC GALLERY</h1>
    <div class="con">
        <div class="box">
            <img src="/1.png" alt="">
            <img src="/3.png" alt="">
            <img src="/2.png" alt="">
            <img src="/4.png" alt="">
        </div>

        <div class="box">
            <img src="/4.png" alt="">
            <img src="/1.png" alt="">
            <img src="/3.png" alt="">
            <img src="/2.png" alt="">
        </div>

        <div class="box">
            <img src="/2.png" alt="">
            <img src="/4.png" alt="">
            <img src="/3.png" alt="">
            <img src="/4.png" alt="">
        </div>

        <div class="box">
            <img src="/1.png" alt="">
            <img src="images/2.png" alt="">
        </div>
    </div>
</body>
</html>
